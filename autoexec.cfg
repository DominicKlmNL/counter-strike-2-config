		bind scancode78 "buy ak47;buy m4a1"
		bind scancode79 "buy hegrenade"
		bind scancode80 "buy incgrenade; buy molotov"
		bind scancode81 "buy smokegrenade"
		bind scancode82 "buy flashbang"
		bind scancode86 "buy decoy"
