ECHOLN [Client]"	:	---[           Loading Keybinds           ]----"
ECHOLN [Client]"	:			 --- Setting weapon binds ---"

;// Keybinds for quick purchases
		bind scancode76 "buy vesthelm;buy vest"
		bind scancode77 "buy galilar;buy famas"
		bind scancode78 "buy ak47;buy m4a1"
		bind scancode79 "buy hegrenade"
		bind scancode80 "buy incgrenade; buy molotov"
		bind scancode81 "buy smokegrenade"
		bind scancode82 "buy flashbang"
		bind scancode86 "buy decoy"
		bind scancode87 "buy defuser"
		bind scancode92 "buy deagle"
		bind scancode93 "buy awp"
		bind scancode94 "buy p250"

ECHOLN	[Client]"	:	--- Setting Mouse Binds ---"
;// Mousewheel Exemption Keybinds
	bind "MWHEELUP" "+jump"
	bind "MWHEELDOWN" "+jump"

ECHOLN	[Client]"	:	--- Setting Movement and Chat Binds ----"
;// CS2 Scancode Keybinds
	bind scancode44 "+jump" 
	bind scancode8 "+use"  
	bind scancode225 "+sprint"
	bind scancode19 "say ¯\_(ツ)_/¯"	
;// CS2 Native Jumpthrow Bind
	bind scancode17 "+jump; -attack; -attack2"

ECHOLN	[Client]"	:	_______________________________________________"
ECHOLN	[Client]"	:	|         Keybinds loaded succesfully         |"
ECHOLN	[Client]"	:	_______________________________________________"
ECHOLN	[Client]"	:	--- Setting Default Values ---"
;// Setting Default Values
	sensitivity 	"0.65"
	volume 			"0.7"

ECHOLN	[Client]"	:	--- Set Bandwidth Rate ---"
;// Set Bandwidth Rate
	rate 			"1000000"											// Sets bandwidth to maximum to minimize delays in receiving player positions, shot registrations, and utility updates during firefights

ECHOLN	[Client]"	:	--- Set Custom Viewmodel---"
;// Viewmodel settings
	;// desktop "60"	classic "68"
		viewmodel_fov "68"
	;// desktop "1"		classic "2.5"
		viewmodel_offset_x "2.5"		
	;//	desktop "1"		classic "0"
		viewmodel_offset_y "2"		
	;// desktop "-1.5"	classic "-1.5"
		viewmodel_offset_z "-2"

ECHOLN	[Client]"	:	--- Team Visibility Enhancement ----"
;// show equipment team
	cl_teamid_overhead_mode "2"											// Enables that names, gear (weapons, granades en health) from your teammates through walls

ECHOLN	[Client]"	:	--- Sound Enhancement ----"
;// Sound Enhancement for CS2 audio engine
	snd_mixahead 					"0.011"								// Determines the size of the audiobuffer to reflect the gamesound is close as possible to real-time
	snd_headphone_pan_exponent 		"1"									// Determines the volumecurve to maintain a natural, linear audio curve for accurate tracking of enemy distance
	snd_musicvolume 				"0.03"								// Sets master volume for all in-game music to 3% of its maximum level
	snd_tensecondWarning_volume 	"0.10"								// Set volume of the critical 10 second bomb countdown music to 10%
	voice_always_sample_mic 		"false"								// Stops CS2 from permanently listening to and processing your microphone input
	voice_threshold 				"-120"								// Sets microphone gate to its absolute lowest possible decibel level

ECHOLN	[Client]"	:	--- Network Enhancement ----"
;// ignores dedicated servers with pings above this value.
	mm_dedicated_search_maxping "40"									// Force Valve only to search for servers where my ping is max 40ms

ECHOLN	[Client]"	:	--- HUD Enhancement ----"
;// HUD scale and visibility
	hud_scaling 		"1"												// Set HUD scaling
	hud_showtargetid	"1"												// Ensures that name of an enemy is displayed in red on your HUD

ECHOLN	[Client]"	:	--- Display Loadout ---"
;// Sets loadout	
	cl_showloadout "1"													// Ensures that your equipment HUD element (showing your current weapons, grenades, and defuse kit) stays permanently visible

ECHOLN	[Client]"	:	--- Quality Enhancements ---"
;// Quality Enhancements
	cl_resend "6"														// Controls the delay (in seconds) the game client waits before sending another connection request when trying to connect to a server
	cl_timeout "9999"													// Dictates how long (in seconds) the Counter-Strike 2 client will wait for a response from the server before completely disconnecting you due to an inactive connection

ECHOLN	[Client]"	:	--- Gameplay Enhancements ---"
;// Gameplay Enhancements
	r_drawtracers_firstperson 	"1"										// Ensures that you see the bright, glowing bullet tracer streaks fly out of your own weapon when you fire
	r_drawtracers 				"1"										// Controls whether all bullet tracers (both your own and those fired by your teammates and enemies) are rendered globally by the game engine.
	fps_max 					"0"										// Determines the maximum framerate allowed
	cl_autohelp 				"0"										// Disables the in-game pop-up instructional hints that appear on your screen while playing

ECHOLN	[Client]"	:	--- Loading Custom Crosshair ---"
;// Crosshair Customization
	cl_crosshairsize				"1.5"
	cl_crosshairgap 				"-5"
	cl_crosshairthickness			"0.5"
	cl_crosshaircolor				"0"
	cl_crosshair_outlinethickness	"1"

ECHOLN	[Info]	"	:	--- Write config to disk ---"
host_writeconfig														// Writes settings to game configuration

ECHOLN	[Client]"	:	--- Disabling Vprof & IV profiler(s) ---"
;// Disabling Vprof & IV profiler(s)
	vprof_off															// Disable Vprof profiler, continously collecting telemetry which affects performance and stability
	iv_off																// Disable IV profiler, continously collecting telemetry which affects performance and stability

ECHOLN	"===[     Autoexec Downie2k Completed      ]===="
ECHOLN  "  Configuration completed, closing connection. "

